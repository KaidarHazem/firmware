; Custom ESP32-WROOM-32 + ST7789 240x240 + 4 Physical Buttons
[env:esp-wroom32-st7789]
board = esp32
board_build.partitions = custom_4Mb_full.csv
build_src_filter = ${env.build_src_filter} +<../boards/esp-wroom32-st7789>
build_flags =
	${env.build_flags}
	-Iboards/esp-wroom32-st7789

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=0

	; ==================== Feature gates ====================
	-DHAS_TOUCH=0

	; ==================== Library Flags ====================
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=240
	-DTFT_INVERSION_ON
	-DTFT_CS=27
	-DTFT_DC=26
	-DTFT_RST=25
	-DTFT_BL=-1
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_MISO=-1
	-DUSE_HSPI_PORT=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000

	; ==================== Environment Flags ====================
	-DDEVICE_NAME='"CyberBruce 240"'
	-DBTN_ALIAS='"OK"'
	-DIR_TX_PINS='{ {"G4", 4}, {"G2", 2} }'
	-DIR_RX_PINS='{ {"G4", 4}, {"G2", 2} }'
	-DRF_TX_PINS='{ {"G4", 4}, {"G2", 2} }'
	-DRF_RX_PINS='{ {"G4", 4}, {"G2", 2} }'
	-DROTATION=2
	-DINPUT_HANDLER_TASK_STACK_SIZE=8192

lib_deps =
	${env.lib_deps}

lib_ignore =
	RadioLib
	SmartRC-CC1101-Driver-Lib
